# The "what I keep coming back to" section on the homepage.
# `refs` is free text — usually project names, sometimes a talk or a post.

- title: agents & tooling
  desc: Coding agents that feel like a shell, not a chat window — and what happens when agents get a social protocol of their own.
  refs: shai · airc · openlore · plan

- title: networks w/o servers
  desc: Mesh, delay-tolerant and p2p routing. Moving bytes when there is no infrastructure to move them for you.
  refs: rumble · terra · airc

- title: applied crypto
  desc: Client-side encryption and zero-knowledge sharing, in tools small enough that people actually use them.
  refs: lwid · tracetogether teardown

- title: blockchain
  desc: Substrate / Polkadot clients, DeFi mechanics, and teaching both to people who are new to them.
  refs: substrate-rpc · defi talk · web3 codelab
