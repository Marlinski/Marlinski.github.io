- name: substrate-rpc
  url: https://github.com/NodleCode/substrate-client-kotlin
  blurb: RPC client for Parity Substrate / Polkadot chains, on Android.
  years: "2020"
  tags: [blockchain, polkadot, kotlin]
  status: archived
  term:
    - { kind: note, text: "// build.gradle" }
    - { kind: out,  text: "dependencies {" }
    - { kind: cmd,  text: "  implementation" }
    - { kind: key,  text: "  'com.github.NodleCode:" }
    - { kind: key,  text: "   substrate-client-kotlin:1.0'" }
    - { kind: out,  text: "}" }

- name: Terra
  url: https://github.com/Marlinski/Terra
  blurb: Extensible DTN Bundle Protocol library and daemon, presented at IETF.
  years: "2018"
  tags: [dtn, networking, java]
  status: archived
  term:
    - { kind: cmd,  text: "$ terra -d -s VOLATILE" }
    - { kind: cmd,  text: "$ dtncat 127.0.0.1 4557 \\" }
    - { kind: cmd,  text: "    -l /test/recv/bundle" }
    - { kind: out,  text: "sink registered." }
    - { kind: key,  text: "cookie: 31cb71b7-783a-4009…" }
