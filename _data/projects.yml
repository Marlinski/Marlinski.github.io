# Projects shown on the homepage.
#
# status:   active | archived  — drives the marker (filled vs hollow) and the group
# featured: true               — also gets a preview card at the top of the page
# shot:     path to a 16:9 image under /images/projects/
# term:     lines of a terminal session, used as the preview when there is no shot
#
# Order here is the order on the page.

- name: SHAI
