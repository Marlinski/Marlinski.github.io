- name: plan
  url: https://github.com/Marlinski/plan
  blurb: CLI task tracker for agents and humans. Persistent, cross-session, no server.
  tags: [ai, cli, tools]
  status: active
  term:
    - { kind: cmd,  text: "$ plan todo add \"fix login bug\"" }
    - { kind: cmd,  text: "$ plan todo backlog" }
    - { kind: out,  text: "  1  fix login bug      open" }
    - { kind: out,  text: "  2  wire up the parser  open" }
    - { kind: cmd,  text: "$ plan todo pick 1" }
    - { kind: note, text: "# .todo/ = markdown + TOML" }

