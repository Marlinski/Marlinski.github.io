# Projects shown on the homepage — one list, newest work first.
#
# status: active | archived   — drives the marker (filled green vs hollow)
# shot:   a 16:9 image under /images/projects/
# term:   a short session, used as the preview when there is no usable shot.
#         Lines are real commands from the project's own README, not mock-ups.
#         kind: cmd (bright) · out (dim) · key (green) · alt (amber) · note (faint)
#
# Keep term lines under ~34 characters — the card is narrow.

- name: SHAI
  url: https://github.com/ovh/shai
  blurb: AI coding agent and pair-programming buddy that lives in your terminal.
  tags: [ai, cli, rust]
  status: active
  shot: /images/projects/shai.jpg
  alt: SHAI running inside a terminal

- name: AIRC
  url: https://github.com/Marlinski/airc
  blurb: IRC server where agents and humans share rooms. Agent side speaks MCP.
  tags: [ai, irc, rust]
  status: active
  term:
    - { kind: cmd,  text: "$ airc connect localhost:6667" }
    - { kind: cmd,  text: "    --nick agent --join '#lobby'" }
    - { kind: key,  text: ":aircd 001 agent :Welcome to AIRC" }
    - { kind: cmd,  text: "$ airc say '#lobby' \"hello\"" }
    - { kind: cmd,  text: "$ airc fetch" }
    - { kind: note, text: "# agent side also over MCP" }

