[package]
name = "minitel"
version = "0.1.0"
edition = "2021"
description = "marlinski.org, served over SSH as a Minitel"

[dependencies]
russh = "0.63"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
html2text = "0.17"
anyhow = "1"
rand = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
