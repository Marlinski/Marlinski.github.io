<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <div id="container">
    {% include header.html %}

    <main>
      {{ content }}
    </main>

    <footer>
      <span>marlinski.org</span>
      <span class="foot-right">built with jekyll · <a href="https://github.com/Marlinski/Marlinski.github.io" target="_blank">source</a></span>
    </footer>
  </div>
  {% include analytics.html %}
</body>
</html>
