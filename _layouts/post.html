<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} — {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <div id="container">
    {% include header.html %}

    <main>
      <article>
        <div class="post-header">
          <h2 class="post-title">{{ page.title }}</h2>
          <time class="post-date">{{ page.date | date: "%Y-%m-%d" }}</time>
          {% if page.tags.size > 0 %}
          <span class="post-tags">{% for tag in page.tags %}<a class="tag" href="{{ '/blog' | relative_url }}#{{ tag }}">{{ tag }}</a>{% endfor %}</span>
          {% endif %}
        </div>
        <div class="post-content">
          {{ content }}
        </div>
      </article>
      <div class="post-footer">
        <a href="{{ '/blog' | relative_url }}">← back to blog</a>
      </div>
    </main>

    <footer>
      <span>marlinski.org</span>
      <span class="foot-right">built with jekyll · <a href="https://github.com/Marlinski/Marlinski.github.io" target="_blank">source</a></span>
    </footer>
  </div>
  {% include analytics.html %}
</body>
</html>
